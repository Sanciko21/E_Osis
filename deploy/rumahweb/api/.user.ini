; E-OSIS — pengaturan PHP khusus folder api/ (proxy).
; Isi request diteruskan mentah ke API (termasuk unggahan foto multipart), jadi PHP tidak perlu
; mem-parsing-nya. Batas ukuran foto tetap dijaga API (maks. 2 MB).
enable_post_data_reading = Off
post_max_size = 8M
upload_max_filesize = 8M
max_execution_time = 90
expose_php = Off
